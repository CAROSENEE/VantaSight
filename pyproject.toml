[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantasight"
version = "0.1.0"
description = "Offline visual analytics for recorded FPS footage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["opencv-python==5.1.0.95"]

[project.scripts]
vantasight = "vantasight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
